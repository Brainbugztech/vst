name: Website prüfen

# Testet die Website bei jeder Änderung im Ordner website/ (Typen, Tests, Build).
on:
  push:
    paths: [ 'website/**', '.github/workflows/website-*.yml' ]
  pull_request:
    paths: [ 'website/**', '.github/workflows/website-*.yml' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run check
