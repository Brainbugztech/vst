name: Build Bugz HQ (Windows-App)

on:
  push:
    paths: [ 'hq-app/**', '.github/workflows/hq-app.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: hq-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Code prüfen
        shell: bash
        run: |
          for f in main.js preload.js discord.js store.js cloud.js updater.js renderer/app.js renderer/cloud-ui.js; do node --check "$f"; done

      # Jede Exe bekommt eine eigene, steigende Versionsnummer, damit das Selbst-Update sie erkennt
      - name: Version setzen
        shell: bash
        run: npm version "0.2.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Exe bauen
        run: npm run dist

      - name: Exe hochladen
        uses: actions/upload-artifact@v4
        with:
          name: BugzHQ
          path: hq-app/dist/BugzHQ-*.exe
          if-no-files-found: error

      # Die Exe zusätzlich als Release „hq-latest“ ablegen, damit sie sich ohne Artifact-Download holen lässt (nur main und manueller Start)
      - name: Exe als Release ablegen
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view hq-latest >/dev/null 2>&1 || gh release create hq-latest --prerelease --title "Bugz HQ (neueste Exe)" --notes "Wird bei jedem Build ersetzt. Die Exe kommt in den Cloud-Ordner _HQ-App."
          gh release delete-asset hq-latest "$(ls dist/BugzHQ-*.exe | xargs -n1 basename | head -1)" -y 2>/dev/null || true
          gh release upload hq-latest dist/BugzHQ-*.exe --clobber
