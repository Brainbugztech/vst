name: Build Windows VST3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Schriften holen (Chakra Petch, Share Tech Mono, OFL)
        shell: bash
        run: |
          base=https://github.com/google/fonts/raw/main/ofl
          curl -fsSL -o Assets/ChakraPetch-SemiBold.ttf $base/chakrapetch/ChakraPetch-SemiBold.ttf || echo "Font fehlt"
          curl -fsSL -o Assets/ChakraPetch-Bold.ttf $base/chakrapetch/ChakraPetch-Bold.ttf || echo "Font fehlt"
          curl -fsSL -o Assets/ShareTechMono-Regular.ttf $base/sharetechmono/ShareTechMono-Regular.ttf || echo "Font fehlt"
          ls -la Assets

      - name: JUCE-Cache
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.9-${{ runner.os }}

      - name: Konfigurieren
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Bauen
        run: cmake --build build --config Release --parallel

      - name: VST3 einsammeln
        shell: pwsh
        run: |
          $vst = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" | Where-Object { $_.FullName -match "Release" } | Select-Object -First 1
          if (-not $vst) { $vst = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" | Select-Object -First 1 }
          Write-Host "Gefunden: $($vst.FullName)"
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item -Recurse $vst.FullName out/
          "VST3_PATH=out/$($vst.Name)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Brainbugz-Haas-VST3
          path: out/

      - name: Pluginval-Test
        id: pv
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          .\pluginval\pluginval.exe --strictness-level 5 --skip-gui-tests --validate-in-process --validate "$env:VST3_PATH" *> out/pluginval.txt
          $code = $LASTEXITCODE
          Get-Content out/pluginval.txt -Tail 30
          exit $code

      - name: Build-Infos schreiben
        shell: pwsh
        run: |
          $fonts = (Get-ChildItem Assets -Filter *.ttf | ForEach-Object Name) -join ", "
          @(
            "Commit: $env:GITHUB_SHA",
            "Datum: $(Get-Date -Format o)",
            "Schriften: $fonts",
            "Pluginval: ${{ steps.pv.outcome }}"
          ) | Out-File out/build-info.txt
          Compress-Archive -Path "$env:VST3_PATH" -DestinationPath out/Brainbugz-Haas-VST3.zip

      - name: Auf Branch "builds" ablegen
        shell: bash
        run: |
          mkdir pub && cp out/Brainbugz-Haas-VST3.zip out/build-info.txt out/pluginval.txt pub/ 2>/dev/null || true
          cd pub
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds

      - name: Pluginval-Ergebnis pruefen
        if: steps.pv.outcome != 'success'
        run: exit 1
