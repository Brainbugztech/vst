name: Build Windows VST3

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Schriften holen (Chakra Petch, Share Tech Mono, Sedgwick Ave Display, OFL)
        shell: bash
        run: |
          base=https://github.com/google/fonts/raw/main/ofl
          curl -fsSL -o Assets/ChakraPetch-SemiBold.ttf $base/chakrapetch/ChakraPetch-SemiBold.ttf || echo "Font fehlt"
          curl -fsSL -o Assets/ChakraPetch-Bold.ttf $base/chakrapetch/ChakraPetch-Bold.ttf || echo "Font fehlt"
          curl -fsSL -o Assets/ShareTechMono-Regular.ttf $base/sharetechmono/ShareTechMono-Regular.ttf || echo "Font fehlt"
          curl -fsSL -o Plugins/BleepDesigner/Assets/SedgwickAveDisplay-Regular.ttf $base/sedgwickavedisplay/SedgwickAveDisplay-Regular.ttf || echo "Font fehlt"
          ls -la Assets

      - name: JUCE-Cache
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.9-${{ runner.os }}

      - name: Konfigurieren
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Bauen
        run: cmake --build build --config Release --parallel

      - name: VST3 einsammeln
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $all = Get-ChildItem -Path build/Plugins -Recurse -Directory -Filter "*.vst3" | Where-Object { $_.FullName -match "Release" -and $_.Parent.Name -eq "VST3" }
          if (-not $all) { Write-Error "Keine VST3 gefunden"; exit 1 }
          foreach ($vst in $all) {
            Write-Host "Gefunden: $($vst.FullName)"
            Copy-Item -Recurse $vst.FullName out/
          }

      - name: Hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Brainbugz-VST3
          path: out/

      - name: Pluginval-Test
        id: pv
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          $fail = 0
          foreach ($vst in Get-ChildItem out -Directory -Filter "*.vst3") {
            $name = $vst.BaseName -replace " ", "-"
            $log = "out/pluginval-$name.txt"
            $p = Start-Process -FilePath ".\pluginval\pluginval.exe" -Wait -PassThru -NoNewWindow `
                   -ArgumentList @("--strictness-level", "5", "--skip-gui-tests", "--validate-in-process", "--validate", "`"$($vst.FullName)`"") `
                   -RedirectStandardOutput $log -RedirectStandardError "out/pluginval-$name-err.txt"
            Write-Host "$($vst.Name): Exit $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { $fail = 1 }
            Get-Content $log -Tail 8
          }
          exit $fail

      - name: Build-Infos schreiben
        shell: pwsh
        run: |
          $fonts = ((Get-ChildItem Assets, Plugins/*/Assets -Filter *.ttf -ErrorAction SilentlyContinue) | ForEach-Object Name) -join ", "
          @(
            "Commit: $env:GITHUB_SHA",
            "Datum: $(Get-Date -Format o)",
            "Schriften: $fonts",
            "Pluginval: ${{ steps.pv.outcome }}"
          ) | Out-File out/build-info.txt
          foreach ($vst in Get-ChildItem out -Directory -Filter "*.vst3") {
            $zip = "out/" + ($vst.BaseName -replace " ", "-") + "-VST3.zip"
            Compress-Archive -Path $vst.FullName -DestinationPath $zip -Force
          }
          Compress-Archive -Path (Get-ChildItem out -Directory -Filter "*.vst3").FullName -DestinationPath out/Brainbugz-alle-VST3.zip -Force

      - name: Auf Branch "builds" ablegen
        shell: bash
        run: |
          mkdir pub && cp out/*.zip out/build-info.txt out/pluginval-*.txt pub/ 2>/dev/null || true
          cd pub
          git init -q -b builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds

      - name: Pluginval-Ergebnis pruefen
        if: steps.pv.outcome != 'success'
        run: exit 1
